# Bazel Java dependency source for bazel-depgen.

repositories:
  - name: central
    url: https://repo.maven.apache.org/maven2
options:
  workspaceDirectory: ../..
  nameStrategy: ArtifactId
  repositoryNameStrategy: ArtifactId
  repositoryRuleGenerationStrategy: module
  targetGenerationStrategy: build
  failOnMissingPom: false

artifacts:
  - coord: com.google.code.gson:gson:2.11.0
    includeSource: false
    excludes:
      - '*:*'
  - coord: com.google.code.findbugs:jsr305:3.0.2
    includeSource: false
    excludes:
      - '*:*'
  - coord: com.uber.nullaway:nullaway:0.14.2
    includeSource: false
  - coord: com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava
    includeSource: false
  - coord: org.jspecify:jspecify:1.0.1
    excludes:
      - '*:*'
  - coord: org.realityforge.javax.annotation:javax.annotation:1.1.1
  - coord: jakarta.annotation:jakarta.annotation-api:1.3.5
  - coord: jakarta.enterprise:jakarta.enterprise.cdi-api:2.0.2
    excludes:
      - 'jakarta.el:jakarta.el-api'
  - coord: javax.enterprise.concurrent:javax.enterprise.concurrent-api:1.1
    java:
      name: enterprise_concurrent_api
  - coord: javax.inject:javax.inject:1
    java:
      name: inject
    visibility:
      - '//visibility:private'
  - coord: org.glassfish.hk2.external:jakarta.inject:2.6.1
  - coord: jakarta.interceptor:jakarta.interceptor-api:1.2.5
    excludes:
      - 'jakarta.ejb:jakarta.ejb-api'
  - coord: javax.persistence:javax.persistence-api:2.2
    java:
      name: persistence_api
  - coord: jakarta.transaction:jakarta.transaction-api:1.3.3
    excludes:
      - '*:*'
  - coord: jakarta.websocket:jakarta.websocket-api:1.1.2
    excludes:
      - '*:*'

  - coord: org.realityforge.jndikit:jndikit:1.4
  - coord: org.glassfish:javax.json:1.1

  - coord: com.google.jsinterop:jsinterop-annotations:2.1.0
  - coord: com.google.jsinterop:base:1.2.0

  - coord: org.realityforge.grim:grim-annotations:0.09
  - coord: org.realityforge.grim:grim-processor:0.09

  - coord: org.realityforge.org.jetbrains.annotations:org.jetbrains.annotations:1.7.0

  - coord: org.mockito:mockito-core:4.5.1
  - coord: net.bytebuddy:byte-buddy:1.12.9
  - coord: org.objenesis:objenesis:3.2

  - coord: org.testng:testng:7.10.2

replacements:
  - coord: org.realityforge.arez:arez-core
    targets:
      - target: ":arez_core"
        nature: Java
  - coord: org.realityforge.arez:arez-extras-testng
    targets:
      - target: ":arez_extras_testng"
        nature: Java
  - coord: org.realityforge.braincheck:braincheck-core
    targets:
      - target: ":braincheck_core"
        nature: Java
  - coord: org.realityforge.braincheck:braincheck-testng
    targets:
      - target: ":braincheck_testng"
        nature: Java
  - coord: org.realityforge.zemeckis:zemeckis-core
    targets:
      - target: ":zemeckis_core"
        nature: Java
      - target: ":zemeckis_core-j2cl"
        nature: J2cl
